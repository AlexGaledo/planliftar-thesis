<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Planlift AR View</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"
    integrity="sha384-Ftcjj/GNLxPvzNDftO/oryXB9aGxsGZY9JGqsXG0uUKgQDl9RfDgsx9NJ/4IVNPe"
    crossorigin="anonymous"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0a0a0a;
      overflow: hidden;
    }
    model-viewer {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      background-color: #0a0a0a;
      --poster-color: #0a0a0a;
    }
    .ar-note {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 18px;
      text-align: center;
      color: #eaeaea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      font-size: 14px;
      pointer-events: none;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
    }
    button[slot="ar-button"] {
      background-color: #ffffff;
      border-radius: 20px;
      border: none;
      position: absolute;
      top: 16px;
      right: 16px;
      padding: 8px 16px;
      font-size: 13px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: #111111;
    }
  </style>
</head>
<body>
  <model-viewer
    src="planlift.glb"
    alt="AR floorplan model"
    ar
    ar-modes="scene-viewer webxr quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1"
    exposure="1"
    tone-mapping="neutral">
    <button slot="ar-button">View in your space</button>
    <div class="ar-note">Tap "View in your space" on a supported phone to place this floorplan in AR.</div>
  </model-viewer>
</body>
</html>
